# ---------------------------------------------------------------------------
# Test-only configuration. Slice tests (@WebMvcTest, @DataJpaTest) load this
# file instead of the production application.yml so they never require a real
# PostgreSQL/Redis instance to be running.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cache:
    type: none

app:
  upload:
    dir: build/test-uploads
    url-prefix: /images
