spring.application.name=todo-list-api

# ? BEST PRACTICE: In a real project, never commit passwords to git.
# Use environment variables like: spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://localhost:5432/tododb
spring.datasource.password=root
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ? FIXED: JWT secret moved here from hardcoded code.
# Must be at least 32 characters (256-bit) for HMAC-SHA256.
# In production, use an environment variable: jwt.secret=${JWT_SECRET}
jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-change-this!
jwt.expiration-ms=86400000
