# =============================================================================
# application.properties - "Student CRUD API" curriculum project
# =============================================================================

spring.application.name=student-crud-api

server.port=8080

# ---------------------------------------------------------------------------
# H2 in-memory database configuration
#
# jdbc:h2:mem:studentdb creates a fresh, private, in-memory database named
# "studentdb" that lives only for the lifetime of the running JVM. This is
# ideal for a teaching project: no external database installation is needed,
# and every restart begins from a clean slate populated by data.sql.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Exposes a web-based console at http://localhost:8080/h2-console so students
# can visually inspect the tables/rows created by JPA and data.sql.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JPA / Hibernate configuration
#
# ddl-auto=update lets Hibernate create/update the "student" table schema
# automatically from the @Entity class at startup - convenient for learning,
# though in real production systems schema migrations are usually managed
# explicitly (e.g. with Flyway or Liquibase).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures data.sql runs against our own schema (created by Hibernate) every
# time the application starts, regardless of the detected database type.
spring.sql.init.mode=always
# Hibernate creates the "student" table asynchronously relative to Spring's
# datasource initializer; deferring script execution until after the
# EntityManagerFactory (and therefore the Hibernate-managed schema) is ready
# avoids "table not found" errors when data.sql runs.
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.blogcode.studentcrudapi=DEBUG
