# =============================================================================
# application.properties - "Hello Spring" curriculum project
#
# Spring Boot automatically loads this file from src/main/resources at startup
# and uses it to configure the application context. Every key here is a
# "configuration property" that some auto-configured Spring bean reads.
# =============================================================================

# The human-readable name of the application. Shows up in log output and is
# useful once you have several microservices running side by side.
spring.application.name=hello-spring

# The embedded Tomcat server (brought in by spring-boot-starter-webmvc) will
# listen on this HTTP port. 8080 is the conventional default for local dev.
server.port=8080

# Raise the root logging level so students can see Spring's own startup logs
# (auto-configuration report, mapped endpoints, etc.) without being flooded by
# DEBUG noise from every library.
logging.level.root=INFO

# Show our own application's package at DEBUG level so students can see the
# GreetingController/GreetingServiceImpl log statements while experimenting.
logging.level.com.blogcode.hellospring=DEBUG
